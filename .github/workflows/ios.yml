name: iOS CI

on:
  push:
    branches: [main, 'feature/**']
    paths: ['iosApp/**', 'shared/**', 'gradle/**', 'settings.gradle.kts', 'build.gradle.kts', '.github/workflows/ios.yml']
  pull_request:
    paths: ['iosApp/**', 'shared/**', 'gradle/**', 'settings.gradle.kts', 'build.gradle.kts', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'
      - name: Compile Kotlin framework for iOS
        run: ./gradlew :shared:shared-domain:compileKotlinIosArm64 :shared:shared-data:compileKotlinIosArm64 :shared:shared-ui:compileKotlinIosArm64 --console=plain
      - name: Build iOS app (xcodebuild, no signing)
        run: |
          cd iosApp
          xcodebuild -project Hallyu.xcodeproj -scheme Hallyu -sdk iphoneos -configuration Debug build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" | tail -20
