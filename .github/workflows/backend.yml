name: Backend CI

on:
  push:
    branches: [main, 'feature/**']
    paths: ['backend/**', 'cli/**', 'database/**', 'gradle/**', 'settings.gradle.kts', 'build.gradle.kts', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'cli/**', 'database/**', 'gradle/**', 'settings.gradle.kts', 'build.gradle.kts', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hallyu_dev
          POSTGRES_DB: hallyu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build & test backend + cli
        run: ./gradlew :backend:test :cli:test :backend:jar :cli:jar --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: backend-test-reports, path: backend/build/reports/tests/test/ }
      - name: Upload CLI jar
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: hallyu-cli-jar, path: cli/build/libs/hallyu.jar }
