name: Android CI

on:
  push:
    branches: [ "main", "arena/01a08d15-hallyu" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee gradle-test.log

      - name: Post build log as commit comment (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "### Build failed on \`$GITHUB_SHA\`"
            echo ""
            echo "#### Compile errors"
            grep -E '^e: ' gradle-build.log gradle-test.log 2>/dev/null | head -300
            echo ""
            echo "#### What went wrong"
            grep -A 30 'What went wrong' gradle-build.log gradle-test.log 2>/dev/null | head -60
            echo ""
            echo "#### Tail"
            tail -n 80 gradle-build.log 2>/dev/null
            tail -n 40 gradle-test.log 2>/dev/null
          } > /tmp/report.txt
          jq -Rs '{body: .}' /tmp/report.txt | gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input -

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
