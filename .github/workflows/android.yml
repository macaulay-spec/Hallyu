name: Android CI

on:
  push:
    branches: [ "main", "arena/01a08d15-hallyu" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee gradle-test.log

      - name: Write failure summary
        if: always()
        run: |
          set +e
          LOG=gradle-build.log
          [ -s "$LOG" ] || LOG=gradle-test.log
          {
            echo "## Gradle log (tail) — $GITHUB_SHA"
            echo
            echo '```'
            grep -E '^e: |error:|FAILURE:|What went wrong|Caused by|> Task .* FAILED' "$LOG" 2>/dev/null | head -200
            echo '...'
            tail -n 120 "$LOG" 2>/dev/null
            echo '```'
          } | head -c 60000 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
