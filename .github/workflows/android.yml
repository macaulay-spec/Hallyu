name: Android CI

on:
  push:
    branches: [ "main", "arena/01a08d15-hallyu" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee gradle-test.log

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOG=gradle-build.log
          [ -s "$LOG" ] || LOG=gradle-test.log

          # 1) Post the log tail as a commit comment via the REST API
          python3 - "$LOG" > /tmp/body.json <<'PY'
          import json, sys
          data = open(sys.argv[1], errors='replace').read()
          json.dump({"body": "```\n" + data[-30000:] + "\n```"}, sys.stdout)
          PY
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/body.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            > /tmp/comment.json 2>/tmp/comment.err || true
          echo "comment response: $(head -c 200 /tmp/comment.json)"

          # 2) Reliable fallback: push the log into the repo with [skip ci]
          git config user.email "ci-bot@users.noreply.github.com"
          git config user.name "CI Bot"
          git fetch origin "$GITHUB_REF_NAME" --depth 1 || true
          git checkout -B ci-report "origin/$GITHUB_REF_NAME" || true
          mkdir -p ci
          cp "$LOG" ci/build-failure.log
          git add ci/build-failure.log
          git commit -m "ci: build failure log [skip ci]" || true
          git push origin "ci-report:$GITHUB_REF_NAME" || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
