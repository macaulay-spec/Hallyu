name: Android CI

on:
  push:
    branches: [ "main", "arena/01a08d15-hallyu" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee gradle-test.log

      - name: Emit failure annotations
        if: always()
        run: |
          set +e
          LOG=gradle-build.log
          [ -s "$LOG" ] || LOG=gradle-test.log
          {
            echo "WHAT WENT WRONG:"
            grep -A 30 'What went wrong' "$LOG" 2>/dev/null | head -40
            echo "COMPILE ERRORS:"
            grep -E '^e: ' "$LOG" 2>/dev/null | head -150
            echo "TAIL:"
            tail -n 100 "$LOG" 2>/dev/null
          } > /tmp/diag.txt
          python3 - <<'PY'
          data = open('/tmp/diag.txt', errors='replace').read()
          data = data.replace('\r', '').replace('\n', ' | ').replace('::', ';:')[:400000]
          n = 8
          chunk = max(1, (len(data) + n - 1) // n)
          for i in range(n):
              piece = data[i * chunk:(i + 1) * chunk]
              if piece:
                  print(f"::error title=build-fail-{i + 1}::{piece}")
          PY

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
