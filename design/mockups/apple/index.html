<title>Hallyu — Apple-Level Blueprint (32 screens)</title>
<style>
  :root { --bg:#0a0a0c; --card:#141419; --ink:#f5f5f7; --muted:#9a9aa5; }
  * { box-sizing: border-box; }
  body { margin:0; background:radial-gradient(1200px 600px at 20% -10%, #2a1238 0%, var(--bg) 55%); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; }
  header { padding:48px 24px 24px; text-align:center; }
  header h1 { margin:0; font-size:34px; letter-spacing:-0.5px; }
  header p { color:var(--muted); margin:10px 0 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:22px; padding:24px; max-width:1500px; margin:0 auto; }
  figure { margin:0; background:var(--card); border:1px solid #24242e; border-radius:18px; overflow:hidden; transition:transform .15s ease; }
  figure:hover { transform:translateY(-3px); }
  figure img { width:100%; display:block; }
  figcaption { padding:12px 14px; font-size:13px; color:var(--muted); }
  figcaption b { color:var(--ink); font-weight:600; display:block; font-size:14px; }
</style>
